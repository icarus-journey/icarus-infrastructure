name: Validação inicial

on:
  push:
    branches:
      - development
      - homologation
      - main
  pull_request:
    branches:
      - development
      - homologation
      - main

permissions:
  contents: read

jobs:
  validar:
    name: Arquivos e formatação
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7.0.1

      - name: Verificar arquivos essenciais
        run: |
          test -f README.md
          test -f .gitignore

      - name: Validar fluxo entre branches
        if: github.event_name == 'pull_request'
        env:
          BRANCH_ORIGEM: ${{ github.head_ref }}
          BRANCH_DESTINO: ${{ github.base_ref }}
        run: |
          case "$BRANCH_DESTINO" in
            main)
              test "$BRANCH_ORIGEM" = "homologation"
              ;;
            homologation)
              test "$BRANCH_ORIGEM" = "development"
              ;;
            development)
              case "$BRANCH_ORIGEM" in
                feature/*) ;;
                *) exit 1 ;;
              esac
              ;;
          esac

      - name: Verificar espaços em branco
        run: git diff-tree --check --no-commit-id -r HEAD
