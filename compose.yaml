name: icarus

services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /dados --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${ICARUS_MINIO_USUARIO:-icarus}
      MINIO_ROOT_PASSWORD: ${ICARUS_MINIO_SENHA:-icarus-desenvolvimento}
    ports:
      - "127.0.0.1:${ICARUS_MINIO_PORTA_API:-9100}:9000"
      - "127.0.0.1:${ICARUS_MINIO_PORTA_CONSOLE:-9101}:9001"
    volumes:
      - minio_raw:/dados
    restart: unless-stopped

  etl:
    profiles: ["dados"]
    build:
      context: ../icarus-data
    environment:
      ICARUS_DADOS_DUCKDB_CAMINHO: /dados/icarus.duckdb
      ICARUS_DADOS_MINIO_ENDPOINT: http://minio:9000
      ICARUS_DADOS_MINIO_CHAVE_ACESSO: ${ICARUS_MINIO_USUARIO:-icarus}
      ICARUS_DADOS_MINIO_CHAVE_SECRETA: ${ICARUS_MINIO_SENHA:-icarus-desenvolvimento}
      ICARUS_DADOS_MINIO_BUCKET: icarus-raw
    volumes:
      - duckdb_dados:/dados
    depends_on:
      - minio

  rabbitmq:
    image: rabbitmq:4.0-management
    environment:
      RABBITMQ_DEFAULT_USER: ${ICARUS_RABBITMQ_USUARIO:-icarus}
      RABBITMQ_DEFAULT_PASS: ${ICARUS_RABBITMQ_SENHA:-icarus-desenvolvimento}
    ports:
      - "127.0.0.1:${ICARUS_RABBITMQ_PORTA:-5672}:5672"
      - "127.0.0.1:${ICARUS_RABBITMQ_PORTA_MANAGEMENT:-15672}:15672"
    volumes:
      - rabbitmq_dados:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  minio_raw:
  duckdb_dados:
  rabbitmq_dados:
