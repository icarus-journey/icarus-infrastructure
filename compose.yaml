name: icarus

services:
  worker:
    profiles: ["mvp"]
    build:
      context: ../icarus-ai
      dockerfile: ../icarus-infrastructure/docker/worker.Dockerfile
    network_mode: host
    environment:
      - ICARUS_RABBITMQ_URL
      - ICARUS_BANCO_OPERACIONAL=/estado/relatorios.sqlite3
    volumes:
      - ../icarus-ai:/app:ro
      - worker_operacional:/estado
    healthcheck:
      test: ["CMD", "python", "-m", "icarus_worker.persistencia.saude"]
      interval: 30s
      timeout: 10s
      retries: 3
    init: true

  mobile:
    build:
      context: ../icarus-mobile
    command: sh /app/scripts/iniciar-expo-container.sh
    volumes:
      - ../icarus-mobile:/app
      - mobile_dependencias:/app/node_modules
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /dados --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${ICARUS_MINIO_USUARIO:-icarus}
      MINIO_ROOT_PASSWORD: ${ICARUS_MINIO_SENHA:-urubu@100}
    ports:
      - "127.0.0.1:${ICARUS_MINIO_PORTA_API:-9100}:9000"
      - "127.0.0.1:${ICARUS_MINIO_PORTA_CONSOLE:-9101}:9001"
    volumes:
      - minio_raw:/dados
    restart: unless-stopped

  etl:
    profiles: ["dados"]
    build:
      context: ../icarus-data
    environment:
      ICARUS_DADOS_DUCKDB_CAMINHO: /dados/icarus.duckdb
      ICARUS_DADOS_MINIO_ENDPOINT: http://minio:9000
      ICARUS_DADOS_MINIO_CHAVE_ACESSO: ${ICARUS_MINIO_USUARIO:-icarus}
      ICARUS_DADOS_MINIO_CHAVE_SECRETA: ${ICARUS_MINIO_SENHA:-urubu@100}
      ICARUS_DADOS_MINIO_BUCKET: icarus-raw
    volumes:
      - duckdb_dados:/dados
    depends_on:
      - minio

  rabbitmq:
    image: rabbitmq:4.0-management
    environment:
      RABBITMQ_DEFAULT_USER: ${ICARUS_RABBITMQ_USUARIO:-icarus}
      RABBITMQ_DEFAULT_PASS: ${ICARUS_RABBITMQ_SENHA:-urubu@100}
    ports:
      - "127.0.0.1:${ICARUS_RABBITMQ_PORTA:-5672}:5672"
      - "127.0.0.1:${ICARUS_RABBITMQ_PORTA_MANAGEMENT:-15672}:15672"
    volumes:
      - rabbitmq_dados:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observabilidade/tempo.yaml:/etc/tempo.yaml
      - tempo_dados:/var/tempo
    ports:
      # Recebe traces via OTLP/HTTP. Publicada no host para a API (fora de container) poder enviar.
      - "127.0.0.1:${ICARUS_TEMPO_PORTA_OTLP:-4318}:4318"
      # API de consulta (o que o Grafana usa internamente); publicada tambem para inspecionar/depurar via curl.
      - "127.0.0.1:${ICARUS_TEMPO_PORTA_QUERY:-3200}:3200"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.3.0
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./observabilidade/loki-config.yaml:/etc/loki/loki-config.yaml
      - loki_dados:/loki
    ports:
      # Recebe logs via API de push do Loki. Publicada no host para a API (fora de container) poder enviar.
      - "127.0.0.1:${ICARUS_LOKI_PORTA:-3100}:3100"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.0.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      # Habilita o recebedor OTLP: a API empurra metricas direto, sem scrape.
      - "--web.enable-otlp-receiver"
    volumes:
      - ./observabilidade/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_dados:/prometheus
    ports:
      - "127.0.0.1:${ICARUS_PROMETHEUS_PORTA:-9090}:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: ${ICARUS_GRAFANA_USUARIO:-icarus}
      GF_SECURITY_ADMIN_PASSWORD: ${ICARUS_GRAFANA_SENHA:-icarus-desenvolvimento}
    volumes:
      - grafana_dados:/var/lib/grafana
      - ./observabilidade/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    ports:
      - "127.0.0.1:${ICARUS_GRAFANA_PORTA:-3000}:3000"
    depends_on:
      - tempo
      - prometheus
      - loki
    restart: unless-stopped

volumes:
  worker_operacional:
  mobile_dependencias:
  minio_raw:
  duckdb_dados:
  rabbitmq_dados:
  tempo_dados:
  prometheus_dados:
  grafana_dados:
  loki_dados:
